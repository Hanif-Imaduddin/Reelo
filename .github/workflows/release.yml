name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Maven Central downloads from GitHub runners kept failing with 504 (redirect to
      # github.com/JetBrains/kotlin/releases). Point every mavenCentral() at Google's mirror instead.
      # Rewrites URLs rather than adding repos, since Flutter's Gradle plugin uses FAIL_ON_PROJECT_REPOS.
      - name: Use Google mirror for Maven Central
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def redirect = { repos ->
            repos.withType(MavenArtifactRepository).configureEach { r ->
              if (r.url.toString().startsWith('https://repo.maven.apache.org/maven2')) r.url = mirror
            }
          }
          beforeSettings { s ->
            redirect(s.pluginManagement.repositories)
            redirect(s.dependencyResolutionManagement.repositories)
          }
          allprojects { p ->
            redirect(p.buildscript.repositories)
            redirect(p.repositories)
          }
          EOF

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/reelo-release-key.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=reelo-release-key.jks
          EOF

      - name: Build APK (version taken from tag)
        run: >
          flutter build apk --release
          --build-name=${GITHUB_REF_NAME#v}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ github.ref_name }}

      - name: Rename APK with version tag
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/reelo-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/reelo-${{ github.ref_name }}.apk
          generate_release_notes: true
