name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/reelo-release-key.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=reelo-release-key.jks
          EOF

      - name: Build APK (version taken from tag)
        run: >
          flutter build apk --release
          --build-name=${GITHUB_REF_NAME#v}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ github.ref_name }}

      - name: Rename APK with version tag
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/reelo-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/reelo-${{ github.ref_name }}.apk
          generate_release_notes: true
